<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotel Operations AI</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#172033;--muted:#68738a;--line:#e6eaf1;--nav:#101a2c;--blue:#315efb;--green:#14845c;--amber:#a96508;--red:#c13b45}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:26px 18px}.brand{font-size:18px;font-weight:750;letter-spacing:-.4px}.brand span{color:#8ea7ff}.subbrand{color:#9eabc0;font-size:11px;margin-top:4px}.navlabel{margin:36px 10px 10px;color:#8190a8;font-size:10px;font-weight:700;letter-spacing:1.2px}.navitem{padding:11px 12px;border-radius:9px;color:#c5cede;margin:4px 0}.navitem.active{background:#263756;color:#fff}.sidefoot{position:fixed;bottom:20px;color:#8190a8;font-size:11px}.main{padding:28px 34px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:26px}.eyebrow{color:var(--blue);font-weight:750;font-size:11px;letter-spacing:1.1px;text-transform:uppercase}.h1{font-size:27px;font-weight:760;letter-spacing:-.8px;margin:3px 0}.muted{color:var(--muted)}.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;color:#48546b;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat{padding:17px 18px}.stat .label{color:var(--muted);font-size:12px}.stat .num{font-size:27px;font-weight:760;margin-top:4px}.stat .hint{font-size:11px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);gap:18px;align-items:start}.panel{padding:20px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.paneltitle{font-size:15px;font-weight:750}.small{font-size:11px;color:var(--muted)}.request{background:#f8f9fc;border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:12px}.fieldlabel{display:block;font-size:11px;font-weight:700;color:#58647a;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid #dce2ec;border-radius:8px;padding:10px 11px;font:inherit;color:var(--ink);background:#fff;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--blue)}textarea{min-height:92px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;font-size:12px;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#edf1ff;color:#294cdb}.ghost{background:#f0f2f6;color:#48546b}.danger{background:#fff0f0;color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:610px}th{text-align:left;color:#7a8498;font-size:10px;text-transform:uppercase;letter-spacing:.7px;padding:10px 8px;border-bottom:1px solid var(--line)}td{padding:13px 8px;border-bottom:1px solid #eef0f5;font-size:12px;vertical-align:middle}.caseid{font-weight:750;color:#46536a}.case-title{font-weight:700}.tag{display:inline-block;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:750}.open{background:#fff2d9;color:var(--amber)}.progress{background:#eaf0ff;color:#3155c8}.resolved{background:#e3f6ee;color:var(--green)}.escalated{background:#ffe8e9;color:var(--red)}.dept{color:#56627a}.actions{display:flex;gap:5px;flex-wrap:wrap}.action{border:0;background:transparent;color:var(--blue);font-size:11px;font-weight:700;cursor:pointer;padding:4px}.activity{border-left:2px solid #dce4ff;padding:0 0 17px 14px;margin-left:5px;position:relative}.activity:before{content:"";position:absolute;left:-5px;top:3px;width:8px;height:8px;background:#6684ff;border-radius:50%}.activity strong{display:block;font-size:12px}.activity p{margin:3px 0;color:var(--muted);font-size:11px}.notice{font-size:11px;color:#657188;background:#f5f7fb;border-radius:8px;padding:10px;margin-top:14px}.empty{text-align:center;padding:24px;color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:12px 16px;border-radius:9px;box-shadow:0 8px 30px #17203330;display:none;z-index:5}
@media(max-width:950px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:22px 16px}.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.sidefoot{display:none}}
@media(max-width:520px){.top{align-items:flex-start;flex-direction:column}.stats{gap:8px}.stat{padding:13px}.stat .num{font-size:23px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<!-- Original dynamic single-file prototype backup for migration preservation -->
</body>
</html>
